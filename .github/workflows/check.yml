name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate cases and key
        run: python -m grader check
      - name: Score the saved absence-set run
        run: python -m grader score results/runs/absence-2026-11-19 --set absence --cases